version: "3"

tasks:
  oci:login:
    desc: "Authenticate OCI session"
    cmds:
      - oci session authenticate

  oci-platform:generate-user-keys:
    desc: "Step 0. Generate the missing API key pairs of ExternalDNS and ExternalSecrets in .keys/next (never overwrites a private key)"
    cmds:
      - |
        set -euo pipefail
        for u in external-dns external-secrets; do
          d=.keys/next/$u
          mkdir -p "$d" && chmod 700 "$d"
          if [ -e "$d/private.pem" ]; then
            echo "$d/private.pem exists: keeping it."
          else
            openssl genrsa -out "$d/private.pem" 2048 2>/dev/null
            echo "$d/private.pem created."
          fi
          chmod 600 "$d/private.pem"
          if ! openssl rsa -check -noout -in "$d/private.pem" >/dev/null 2>&1; then
            echo "$d/private.pem is not a valid RSA private key: fix or remove it by hand." >&2
            exit 1
          fi
          # public.pem and fingerprint.txt are derived from private.pem, so they are recreated when missing.
          if [ ! -s "$d/public.pem" ]; then
            openssl rsa -pubout -in "$d/private.pem" -out "$d/public.pem" 2>/dev/null
          fi
          if [ ! -s "$d/fingerprint.txt" ]; then
            openssl rsa -pubout -outform DER -in "$d/private.pem" 2>/dev/null | openssl md5 -c | sed 's/^.*= //' | tr -d '\n' > "$d/fingerprint.txt"
          fi
          echo "$d: fingerprint $(cat "$d/fingerprint.txt")"
        done

  oci-platform:generate-ci-keys:
    desc: "Step 0. Generate key pair for the ci-terraform technical user"
    cmds:
      - echo "Generating key pair for the ci-terraform technical user"
      - rm -rf ./.keys/ci
      - mkdir -p ./.keys/ci
      - openssl genrsa -out .keys/ci/ci-terraform.pem 2048
      - openssl rsa -pubout -in .keys/ci/ci-terraform.pem -out .keys/ci/ci-terraform_public.pem
      - echo "Keys generated in .keys/ci/ directory"

  oci-platform:generate-ssh-keys:
    desc: "Step 0. Generate SSH key pair for OKE worker nodes"
    cmds:
      - echo "Generating SSH key pair for OKE worker nodes"
      - rm -rf ./.keys/ssh
      - mkdir -p ./.keys/ssh
      - ssh-keygen -t ed25519 -f .keys/ssh/id_ed25519 -N '' -C oke-worker
      - echo "SSH keys generated in .keys/ssh/ directory"

  oci-platform:install-network:
    desc: "Step 1. Install network layer"
    dir: 01-network
    cmds:
      - echo "Installing network layer..."
      - tofu init
      - tofu apply

  oci-platform:install-identity:
    desc: "Step 2. Install identity layer"
    dir: 02-identity
    cmds:
      - echo "Installing identity layer..."
      - |
        CI_PUBLIC_KEY=$(cat ../.keys/ci/ci-terraform_public.pem)
        # The API keys of the two technical users come from ../.keys/next/<user>/public.pem.
        for u in external-dns external-secrets; do
          if [ ! -f ../.keys/next/$u/public.pem ]; then
            echo "Missing ../.keys/next/$u/public.pem: the user would lose its API key." >&2
            exit 1
          fi
        done
        export TF_VAR_external_dns_next_public_key="$(cat ../.keys/next/external-dns/public.pem)"
        export TF_VAR_external_secrets_next_public_key="$(cat ../.keys/next/external-secrets/public.pem)"
        tofu init
        tofu apply \
          -var="ci_terraform_public_key=$CI_PUBLIC_KEY"

  oci-platform:install-oke:
    desc: "Step 3. Install OKE cluster"
    dir: 03-oke
    cmds:
      - echo "Installing OKE..."
      - |
        SSH_PUBLIC_KEY=$(cat ../.keys/ssh/ssh_public.key)
        tofu init
        tofu apply -var="ssh_public_key=$SSH_PUBLIC_KEY"

  oci-platform:install-dns:
    desc: "Step 4. Install DNS"
    dir: 04-dns
    cmds:
      - echo "Installing DNS..."
      - |
        tofu init
        tofu apply

  oci-platform:install-vpn:
    desc: "Step 5. Install VPN"
    dir: 05-vpn
    cmds:
      - echo "Installing VPN..."
      - tofu init
      - tofu apply

  oci-platform:install-cert-manager:
    desc: "Step 6. Install cert-manager"
    dir: 06-cert-manager
    cmds:
      - echo "Installing cert-manager..."
      - tofu init
      - tofu apply

  oci-platform:install-nginx-gateway:
    desc: "Step 7. Install NGINX Gateway"
    dir: 07-nginx-gateway
    cmds:
      - echo "Installing NGINX Gateway..."
      - tofu init
      - tofu apply

  oci-platform:install-external-dns:
    desc: "Step 8. Install ExternalDNS"
    dir: 08-external-dns
    cmds:
      - echo "Installing ExternalDNS..."
      - |
        # Use the key in ../.keys/next/external-dns.
        if [ -f ../.keys/next/external-dns/private.pem ]; then
          PRIVATE_KEY=$(cat ../.keys/next/external-dns/private.pem)
          FINGERPRINT=$(cat ../.keys/next/external-dns/fingerprint.txt)
        else
          echo "Missing ../.keys/next/external-dns/private.pem: run task oci-platform:generate-user-keys first." >&2
          exit 1
        fi
        tofu init
        tofu apply \
          -var="oci_api_private_key=$PRIVATE_KEY" \
          -var="oci_api_private_key_fingerprint=$FINGERPRINT"

  oci-platform:install-external-secrets:
    desc: "Step 9. Install ExternalSecrets"
    dir: 09-external-secrets
    cmds:
      - echo "Installing ExternalSecrets..."
      - |
        # Use the key in ../.keys/next/external-secrets.
        if [ -f ../.keys/next/external-secrets/private.pem ]; then
          PRIVATE_KEY=$(cat ../.keys/next/external-secrets/private.pem)
          FINGERPRINT=$(cat ../.keys/next/external-secrets/fingerprint.txt)
        else
          echo "Missing ../.keys/next/external-secrets/private.pem: run task oci-platform:generate-user-keys first." >&2
          exit 1
        fi
        tofu init
        tofu apply -exclude="module.external-secrets.kubernetes_manifest.oci_secret_store" \
          -var="oci_api_private_key=$PRIVATE_KEY" \
          -var="oci_api_private_key_fingerprint=$FINGERPRINT"
        tofu apply \
          -var="oci_api_private_key=$PRIVATE_KEY" \
          -var="oci_api_private_key_fingerprint=$FINGERPRINT"

  oci-platform:install-gitlab-agent:
    desc: "Step 10. Install GitLab Agent"
    dir: "10-gitlab-agent"
    cmds:
      - echo "Installing GitLab Agent..."
      - tofu init
      - tofu apply

  oci-platform:install-filesystem-storage-class:
    desc: "Step 11. Install OCI File Storage storage class"
    dir: "11-filesystem-storage-class"
    cmds:
      - echo "Installing OCI File Storage storage class..."
      - tofu init
      - tofu apply

  oci-platform:install-origin-ca-issuer:
    desc: "Step 12. Install Cloudflare Origin CA issuer (two-phase apply)"
    dir: "12-origin-ca-issuer"
    cmds:
      - echo "Installing Origin CA issuer..."
      - |
        tofu init
        tofu apply \
          -exclude="module.origin-ca-issuer.kubernetes_manifest.origin_ca_token" \
          -exclude="module.origin-ca-issuer.kubernetes_manifest.cluster_origin_issuer" \
          -exclude="module.origin-ca-issuer.kubernetes_manifest.origin_certificate"
        tofu apply

  oci-platform:install-block-storage-class:
    desc: "Step 13. Install OCI Block Volume storage class"
    dir: "13-block-storage-class"
    cmds:
      - echo "Installing OCI Block Volume storage class..."
      - tofu init
      - tofu apply

  oci-platform:install-metrics-server:
    desc: "Step 14. Install metrics-server (Metrics API for kubectl top / HPA)"
    dir: "14-metrics-server"
    cmds:
      - echo "Installing metrics-server..."
      - tofu init
      - tofu apply

  oci-platform:install-cloud-guard:
    desc: "Step 15. Enable Cloud Guard in detect-only mode (requires Step 2)"
    dir: "15-cloud-guard"
    cmds:
      - echo "Installing Cloud Guard..."
      - tofu init
      - tofu apply

  oci-platform:install-volume-backup:
    desc: "Step 16. Weekly backup policy for the listed block volumes"
    dir: "16-volume-backup"
    cmds:
      - echo "Installing the volume backup policy..."
      - tofu init
      - tofu apply
